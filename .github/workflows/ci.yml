# Builds, typechecks, tests and format-checks every pull request (including
# Renovate's) and every push to main. Nothing here deploys: the Pi is updated
# by hand (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Builds @print-me/shared (the apps and their tests import its dist), then typechecks everything.
      - run: pnpm run check
      - run: pnpm -r --if-present run test
      - run: pnpm run format:check
